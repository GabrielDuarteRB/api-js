  name: cd-homolog

  on:
    workflow_run:
      workflows: ["container"]
      types:
        - completed
      branches:
        - develop

  jobs:

    render-homolog:
      runs-on: ubuntu-latest
      steps:
        - name: Novo deploy Homologacao
          run: curl --fail --silent --show-error --request POST "${{ secrets.RENDER_HOMOLOG_DEPLOY_HOOK_URL }}"

