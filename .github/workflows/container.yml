name: container

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

jobs:

  docker-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validar Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile


  trivy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout porjeto
        uses: actions/checkout@v6

      - name: Build image
        run: docker build -t api-js:latest .

      - name: Scan de vulnerabilidade
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: api-js:latest
          format: table

  docker-hub:
    runs-on: ubuntu-latest

    name: Enviar para o docker hub
    needs: [docker-lint, trivy]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Entrar no docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/api-js:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/api-js:${{ github.sha }}